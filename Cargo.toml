[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"
authors = ["mlm-games"]
license = "GPL-3.0-only"
repository = "https://github.com/mlm-games/snapshort"
rust-version = "1.98"
description = "Snapshot tool with Repose and Miniter"

[workspace.dependencies]
# Async Runtime
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tokio-util = "0.7.18"
flume = "0.12"
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error Handling
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
derive_more = { version = "2", features = ["full"] }
directories = "6"
parking_lot = "0.12"

# Immutable Collections
im = { version = "15", features = ["serde"] }

repose-core = { path = "../repose/crates/repose-core", version = "0.30" }
repose-ui = { path = "../repose/crates/repose-ui", version = "0.30" }
repose-platform = { path = "../repose/crates/repose-platform", version = "0.30" }
repose-text = { path = "../repose/crates/repose-text", version = "0.30" }
repose-canvas = { path = "../repose/crates/repose-canvas", version = "0.30" }
repose-docking = { path = "../repose/crates/repose-docking", version = "0.30" }
repose-material = { path = "../repose/crates/repose-material", version = "0.30" }

# Media & GPU
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

# Media
symphonia = { version = "0.5", features = ["all"] }
rubato = "1"
cpal = "0.17"

# Image processing
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
] }

# Testing
tokio-test = "0.4"
tempfile = "3"

# Proc macro helpers
trait-variant = "0.1"

# Miniter (like renamite-* internal)
miniter-domain = { path = "../../../StudioProjects/Miniter/rust/crates/miniter-domain", version = "0.1" }
miniter-usecases = { path = "../../../StudioProjects/Miniter/rust/crates/miniter-usecases", version = "0.1" }
miniter-render-plan = { path = "../../../StudioProjects/Miniter/rust/crates/miniter-render-plan", version = "0.1" }
miniter-media-native = { path = "../../../StudioProjects/Miniter/rust/crates/miniter-media-native", version = "0.1", default-features = false, features = ["videoson", "av1"] }
miniter-audio = { path = "../../../StudioProjects/Miniter/rust/crates/miniter-audio", version = "0.1" }
web-time = "1"

[patch.crates-io]
videoson = { git = "https://github.com/mlm-games/videoson" }
muxide = { git = "https://github.com/mlm-games/muxide" }
ass-renderer = { git = "https://github.com/mlm-games/ass-rs", package = "ass-renderer" }
ass-core = { git = "https://github.com/mlm-games/ass-rs", package = "ass-core" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
