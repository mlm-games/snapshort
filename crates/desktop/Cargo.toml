[package]
name = "snapshort-desktop"
version.workspace = true
edition.workspace = true

default-run = "snapshort"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "snapshort"
path = "src/main.rs"

[dependencies]
web-time.workspace = true
serde_json.workspace = true
miniter-domain.workspace = true
miniter-usecases.workspace = true
snapshort-usecases.workspace = true
snapshort-ui-core.workspace = true
snapshort-infra-render.workspace = true
image.workspace = true

# Repose
repose-platform.workspace = true
repose-ui.workspace = true
repose-core.workspace = true
repose-docking.workspace = true
repose-canvas.workspace = true
repose-material.workspace = true

# Async & Utils (portable)
flume.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
parking_lot.workspace = true

rlobkit-dialogs.workspace = true
rlobkit-app-events.workspace = true
# Portable task spawning: real threads where they exist, main-thread fallback
# on stable wasm (raw std::thread::spawn would panic there at runtime).
# Registry (not path): repose already depends on it — a second copy causes
# duplicate-symbol link errors on wasm.
web-workers.workspace = true

# Native backend: tokio runtime, OS dirs, file stores (desktop + Android).
# Web uses the in-memory backend instead (see backend_wasm.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
directories.workspace = true
snapshort-infra-store.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
# Browser file persistence (yadaw wasm_persist.rs pattern).
ropfs.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android_logger.workspace = true
log.workspace = true
winit.workspace = true
rlobkit-app-events = { workspace = true, features = [
    "jni-bridge",
] }
game-utils.workspace = true

[package.metadata.android]
package = "org.mlm.snapshort"
apk_name = "snapshort"
build_targets = ["aarch64-linux-android"]

[[package.metadata.android.application.activity]]
name = "rust.rlobkit.RlobKitMainActivity"
exported = true
launch_mode = "singleTask"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[package.metadata.android.application]
label = "Snapshort"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34
