[package]
name = "snapshort-speech"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Speech-to-text: the Transcriber trait, the Whisper model catalogue and downloader, pure-Rust Whisper inference (candle) with word timestamps, and speaker labelling"
license.workspace = true

[features]
default = []
# Whisper inference on the CPU via candle (pure Rust). Off by default (and in wasm builds).
whisper = ["dep:candle-core", "dep:candle-nn"]
# Model downloads over HTTPS (pure-Rust TLS: rustls + RustCrypto, OS certificate verification).
download = ["dep:ureq", "dep:rustls", "dep:rustls-rustcrypto", "dep:sha2"]
# Multi-threaded spectrogram (rayon). Off by default: the default build stays wasm-clean.
parallel = ["dep:rayon"]

[dependencies]
snapshort-edit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { version = "1", optional = true }
candle-core = { version = "0.9", default-features = false, optional = true }
candle-nn = { version = "0.9", default-features = false, optional = true }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"], optional = true }
rustls = { version = "0.23", default-features = false, optional = true }
rustls-rustcrypto = { version = "0.0.2-alpha", optional = true }
sha2 = { version = "0.10", optional = true }
