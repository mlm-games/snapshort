[package]
name = "snapshort-usecases"
version.workspace = true
edition.workspace = true

[dependencies]
web-time.workspace = true
miniter-domain.workspace = true
miniter-usecases.workspace = true
snapshort-infra-media = { path = "../infra-media" }
snapshort-infra-render = { path = "../infra-render" }

flume.workspace = true
futures.workspace = true

serde.workspace = true
serde_json.workspace = true

thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait = { workspace = true }

# Portable file persistence (native FsStorage, OPFS-backed Storage on web).
snapshort-infra-store = { path = "../infra-store" }
game-utils = { path = "../../../game-utils/crates/game-utils", version = "0.1" }

# Native-only services (tokio task spawning, media engines). The wasm shell
# builds only the pure command/event/type surface + the portable store.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
tokio-test.workspace = true
tempfile.workspace = true
